{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow rounded-4 overflow-hidden">
            <div class="bg-forest text-center py-4 px-3 text-white">
                <h3 class="fw-bold mb-1">Welcome Back </h3>
                <p class="text-white-50 fs-7 mb-0">Login to continue your green shopping journey</p>
            </div>
            
            <div class="card-body p-4 p-md-5 bg-white">
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium text-success">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control bg-light border-0 py-2.5" id="username" name="username" placeholder="Enter username" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium text-success">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control bg-light border-0 py-2.5" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-accent w-100 py-2.5 rounded-pill fw-bold text-dark shadow-sm">
                        Access NatureCart
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0 text-muted fs-7">
                        New to sustainable shopping? 
                        <a href="{% url 'register' %}" class="text-success fw-semibold text-decoration-none">Create an Account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
